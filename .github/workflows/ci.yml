name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在 Actions 页手动触发，便于复现某次失败
  workflow_dispatch:

# 同一分支的新推送取消仍在跑的旧任务，省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 仓库原先只提交了 gradle-wrapper.properties，没有 wrapper 脚本与 jar，
      # 外部贡献者必须自备 Gradle。三件套入库后这里才能真正「零配置」。
      - name: 确保 gradlew 可执行
        run: chmod +x ./gradlew

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 只跑纯 JVM 用例与 debug 组装：release 需要 keystore.properties（不入库），
      # 在 CI 里强行 assembleRelease 只会失败。
      - name: 单元测试
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 组装 debug
        run: ./gradlew assembleDebug --stacktrace

      # 产物仅用于人工核对，不发布
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: sudokumaster-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
