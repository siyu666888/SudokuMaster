name: ✨ 功能建议
description: 新功能、交互改进、视觉与无障碍优化——请用这个表单
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。这个项目是纯单机离线应用，定位轻量、无账号、无网络，
        所以涉及云同步、排行榜、在线对战这类需要服务端的想法，通常不会采纳——
        不是不感兴趣，而是与「离线、不收集任何数据」的设计前提冲突。

        动手前可以先看 [CONTRIBUTING](https://github.com/siyu666888/SudokuMaster/blob/main/CONTRIBUTING.md)，
        里面列了当前最需要帮助的方向。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景和痛点，再说方案。描述具体的使用情境比抽象的需求更容易推动实现。
      placeholder: |
        我习惯在地铁上玩，单手操作时想切换笔记模式必须长按格子，
        另一只手扶着扶手时经常长按失败。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望应用变成什么样？如果涉及新的界面元素，可以描述位置、交互和触发方式。
      placeholder: |
        希望工具栏上的笔记按钮支持单击切换「强制笔记模式」，
        开启后所有落子都记为候选数，直到再次点击关闭。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能区域
      options:
        - 首页 / 续玩卡片
        - 对局棋盘与工具栏
        - 提示与撤销等辅助功能
        - 成就墙
        - 历史记录与统计
        - 设置与主题外观
        - 无障碍（TalkBack / 大字体 / 对比度）
        - 国际化（多语言）
        - 数据备份与题目导入
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充说明（可选）
      description: 有没有现成的替代做法？其他数独 App 是怎么处理的？参考截图或链接都可以贴。
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: 你愿意自己实现吗
      description: 愿意动手的话我会在 issue 里给出具体的改动位置和实现思路。
      options:
        - 愿意提交 PR
        - 想试试，但需要一些指导
        - 只提建议，暂时没时间写代码
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已在 Issues 与 Discussions 中搜索过，没有找到相同建议
          required: true
